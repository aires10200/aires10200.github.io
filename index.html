<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfólio — desktop retrô</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="panel">
  <div class="left">
    <span class="host" id="host"></span>
    <span class="status"><i></i>open to work</span>
  </div>
  <time id="clock"></time>
</header>

<main class="desktop" id="desktop">
  <div class="hero">
    <div class="cmd"><b>~</b> $ whoami</div>
    <h1><span id="heroName"></span><span class="cursor"></span></h1>
    <p id="heroTag"></p>
  </div>

  <nav class="icons" aria-label="Atalhos">
    <button class="icon" data-open="sobre">
      <svg viewBox="0 0 52 52" aria-hidden="true"><rect x="4" y="8" width="44" height="36" rx="5" fill="#1E2A2F"/><rect x="4" y="8" width="44" height="9" rx="4" fill="#1F4E5A" stroke="#1E2A2F" stroke-width="2"/><rect x="4" y="8" width="44" height="36" rx="5" fill="none" stroke="#1E2A2F" stroke-width="2"/><path d="M13 25l6 5-6 5" fill="none" stroke="#E0A526" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 36h10" stroke="#F7F8F3" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>sobre</span>
    </button>
    <button class="icon" data-open="projetos">
      <svg viewBox="0 0 52 52" aria-hidden="true"><path d="M5 14a3 3 0 0 1 3-3h11l5 5h20a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z" fill="#E0A526" stroke="#1E2A2F" stroke-width="2" stroke-linejoin="round"/><path d="M5 22h42" stroke="#1E2A2F" stroke-width="2"/><path d="M20 30l-4 3.5 4 3.5M32 30l4 3.5-4 3.5M28 28l-4 11" fill="none" stroke="#1E2A2F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>projetos</span>
    </button>
    <button class="icon" data-open="conquistas">
      <svg viewBox="0 0 52 52" aria-hidden="true"><path d="M17 8h18v12a9 9 0 0 1-18 0z" fill="#E0A526" stroke="#1E2A2F" stroke-width="2" stroke-linejoin="round"/><path d="M17 12H9c0 7 3 10 8 10M35 12h8c0 7-3 10-8 10" fill="none" stroke="#1E2A2F" stroke-width="2" stroke-linejoin="round"/><path d="M26 29v8" stroke="#1E2A2F" stroke-width="2"/><rect x="16" y="37" width="20" height="7" rx="2" fill="#1F4E5A" stroke="#1E2A2F" stroke-width="2"/></svg>
      <span>conquistas</span>
    </button>
    <button class="icon" data-open="objetivos">
      <svg viewBox="0 0 52 52" aria-hidden="true"><path d="M13 6v40" stroke="#1E2A2F" stroke-width="2.6" stroke-linecap="round"/><path d="M13 9h27l-7 9 7 9H13z" fill="#D9604C" stroke="#1E2A2F" stroke-width="2" stroke-linejoin="round"/><path d="M7 46h14" stroke="#1E2A2F" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span>objetivos</span>
    </button>
    <button class="icon" data-open="contato">
      <svg viewBox="0 0 52 52" aria-hidden="true"><rect x="5" y="12" width="42" height="29" rx="4" fill="#FFFFFF" stroke="#1E2A2F" stroke-width="2"/><path d="M6 14l20 15 20-15" fill="none" stroke="#1E2A2F" stroke-width="2" stroke-linejoin="round"/><circle cx="41" cy="13" r="6" fill="#3FA66B" stroke="#1E2A2F" stroke-width="2"/></svg>
      <span>contato</span>
    </button>
  </nav>
</main>

<footer class="dock" id="dock"></footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
